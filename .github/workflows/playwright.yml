name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install Node dependencies
      run: npm ci
    - name: Install minimal Python backend dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn pydantic python-multipart slowapi python-dotenv groq google-genai
    - name: Start FastAPI backend server
      env:
        GROQ_API_KEY: ci_mock_key
      run: |
        python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
      working-directory: backend
    - name: Wait for FastAPI Backend Server Readiness
      run: |
        echo "Waiting for FastAPI server on http://127.0.0.1:8000/docs..."
        curl --retry 15 --retry-delay 2 --retry-connrefused -s http://127.0.0.1:8000/docs > /dev/null
        echo "FastAPI server is READY!"
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run TypeScript Typecheck
      run: npm run typecheck
    - name: Run Production Next.js Build
      run: npm run build
    - name: Run Playwright tests
      env:
        GROQ_API_KEY: ci_mock_key
        NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
